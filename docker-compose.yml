services:
  postgres:
    image: postgres:16-alpine
    container_name: vaccines-postgres
    environment:
      POSTGRES_DB: vaccines
      POSTGRES_USER: vaccines
      POSTGRES_PASSWORD: vaccines
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vaccines" ]
      interval: 5s
      timeout: 5s
      retries: 5

  vaccines-api:
    build: .
    container_name: vaccines-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  postgres_data: