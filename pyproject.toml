[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes (неиспользуемые импорты, переменные и т.п.)
    "I", # isort (сортировка импортов)
    "UP", # pyupgrade (устаревший синтаксис Python)
    "B", # flake8-bugbear (частые логические ошибки)
    "W", # Слишком длинная строка
    "S", # Безопасность
    "SIM", # Помогает упрощать код
    "D",
    "PT"
]
ignore = [
    "E501", # длина строки - её и так контролирует line-length, дублировать не нужно
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D103"] # assert в тестах это не ошибка
#"tests/*" = ["B008"] Depends(...) в дефолтных значениях - нормальный паттерн FastAPI, а не баг. Не в тестах убрала проверку точечно

[tool.mypy]
python_version = "3.13"
plugins = ["sqlalchemy.ext.mypy.plugin"]

# На старте - мягкий режим
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
